
name: Complementary quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_hub_test
          POSTGRES_USER: incident_user
          POSTGRES_PASSWORD: integration_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_user -d incident_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://incident_user:integration_test_only@localhost:5432/incident_hub_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare PostgreSQL test database
        env:
          PGPASSWORD: integration_test_only
        run: |
          psql -h localhost -U incident_user \
            -d incident_hub_test \
            -v ON_ERROR_STOP=1 \
            -f database/init.sql

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Dependency security audit
        run: npm audit --audit-level=high
