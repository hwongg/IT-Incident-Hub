
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.OS -equals Windows_NT

variables:
  NODE_VERSION: '22.x'

steps:
  - checkout: self
    displayName: Checkout source
    clean: true

  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: $(NODE_VERSION)

  - script: npm ci
    displayName: Install dependencies

  - script: npm run lint
    displayName: Lint

  - script: npm test
    displayName: Run tests

  - script: npm audit --audit-level=high
    displayName: Dependency security review

  - powershell: |
      New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)\incident-hub" | Out-Null
      Compress-Archive -Path "backend", "frontend", "database", "tests", "package.json", "package-lock.json", "compose.yaml", "Dockerfile", "README.md" -DestinationPath "$(Build.ArtifactStagingDirectory)\incident-hub\source.zip" -Force
    displayName: Build and package application

  - task: PublishBuildArtifacts@1
    displayName: Publish build artifact
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)\incident-hub'
      ArtifactName: incident-hub
      publishLocation: Container
